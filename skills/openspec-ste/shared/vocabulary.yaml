# 通用受控词表、模糊词清单与默认阈值（openspec-ste 内置默认值）
#
# - 按 STE 原则自行编写：一个意思只用一个词，非受控词给出唯一的受控替代词。
#   不是 ASD-STE100 官方词典的翻译或摘录（ADR-0005）。规则说明见 shared/ste-rules.md。
# - 项目在 openspec/ste.yaml 中用 add / remove 增删条目，用 thresholds 覆盖阈值。
# - 非受控词与模糊词至少 2 个字：检查用子串匹配，1 个字的词会大面积误报。
# - exceptions：含该词但不算违规的短语（如「利用率」），命中位置落在其中时不报告。

version: 1

# 默认阈值（C-R6.3 描述句字数、C-R5.1 指令句字数、C-R6.6 段落句数）。
# 40 / 30 字由 STE 25 / 20 词按约 1.5 字/词折算，折算比未经验证，句长规则只告警。
thresholds:
  descriptive: 40
  instruction: 30
  paragraph: 6

