schema: spec-driven

# 中文 STE 规则（由 openspec-ste/shared/ste-rules.md 生成：node ste-lint.mjs config-snippet）
# 修改规则请改规则表后重新生成，不要直接编辑本片段。
rules:
  proposal: &ste-rules
    - "C-R1.1：只用三类词：通用受控词表中的受控词、技术名词、技术动词；词表列出的非受控词改用其受控替代词"
    - "C-R1.2：受控词只按词表规定的词性使用"
    - "C-R1.3：受控词只取一个固定含义，不用同一个词表达不同意思"
    - "C-R1.5：本领域专有事物的名称作为技术名词，登记在 CONTEXT.md"
    - "C-R1.6：词表外的词只在它是技术名词或技术动词时使用"
    - "C-R1.7：技术名词不当动词用"
    - "C-R1.8：技术名词采用项目、行业或专业领域公认的叫法"
    - "C-R1.9：需要新起技术名词时，选短而易懂的写法"
    - "C-R1.10：不用方言、俚语或圈内黑话充当技术名词"
    - "C-R1.11：同一事物只用一个术语；CONTEXT.md 中 `_Avoid_` 列出的叫法是禁用别名，改用该术语"
    - "C-R1.12：本领域专有的动作可作为技术动词登记在 CONTEXT.md（`_Category_: 技术动词`）"
    - "C-R1.13：技术动词不当名词用"
    - "C-R2.1：名词串不要过长：连续 12 个及以上汉字且中间没有虚词或标点时，加「的」或改写"
    - "C-R2.2：较长的技术名词完整写出，不随意截短"
    - "C-R3.6：用主动语态；描述中只有动作执行者不重要时才用「被」字句"
    - "C-R3.7：用动词表达动作，不用「进行 + 名词」这类名词化写法"
    - "C-R4.1：句子短而清楚；不用不可度量的模糊词，写出具体数值、条件或对象"
    - "C-R4.2：不为缩短句子省略必要的主语、宾语或条件"
    - "C-R4.3：复杂内容用竖排列表"
    - "C-R4.4：用连接词表明相关句子之间的关系"
    - "C-R5.1：指令句不超过 30 字"
    - "C-R5.2：一句只写一个指令，两个动作同时发生时除外；不用「并」「然后」「；」串联多个动作"
    - "C-R5.3：指令用祈使句，以动词开头"
    - "C-R5.4：读者必须先知道的条件写在指令开头"
    - "C-R5.5：注释只提供信息，不写指令"
    - "C-R6.1：逐步给出信息，一句只增加一个新事实"
    - "C-R6.2：用关键词与小标题组织文字的逻辑结构"
    - "C-R6.3：描述句不超过 40 字"
    - "C-R6.4：相关的信息放在同一段"
    - "C-R6.5：一段只写一个主题"
    - "C-R6.6：一段不超过 6 句"
    - "C-R7.1：安全提示用「警告」（数据丢失、安全风险）或「注意」（功能损坏）标明风险等级"
    - "C-R7.2：安全提示以明确的命令或条件开头"
    - "C-R7.3：安全提示说明风险或可能的后果"
    - "C-R8.1：不用分号，拆成两句"
    - "C-R9.1：不逐字直译外文，按中文习惯组织句子"
    - "C-R9.4：术语与措辞保持一致的风格"
  design: *ste-rules
  specs: *ste-rules
  tasks: *ste-rules
